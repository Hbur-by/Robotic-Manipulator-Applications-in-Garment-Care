<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RMAGC 焕衣智联 — 一键搭配</title>
<style>
:root {
  --bg: #f0f2f5;
  --card: #fff;
  --text: #1a1a2e;
  --sub: #8e8e93;
  --radius: 20px;
  --accent: #4A90D9;
  --accent2: #8B5CF6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: var(--card);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.logo {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  font-weight: 700;
}
.title { font-size: 18px; font-weight: 700; }
.subtitle { font-size: 12px; color: var(--sub); margin-top: 2px; }
.main { padding: 16px; max-width: 560px; margin: 0 auto; }

/* Scene selector */
.scene-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.scene-card {
  background: var(--card);
  border: 2px solid transparent;
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.scene-card.active { border-color: var(--accent); }
.scene-emoji { font-size: 28px; }
.scene-label { font-size: 12px; font-weight: 600; margin-top: 6px; }

/* Seed garment */
.seed-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 16px rgba(0,0,0,.06);
}
.seed-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.seed-tag {
  display: inline-block;
  background: #e8f0fe;
  color: var(--accent);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  margin: 3px;
}

/* Recommend button */
.btn-recommend {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 20px;
  box-shadow: 0 4px 14px rgba(74,144,217,.3);
  transition: all .2s;
}
.btn-recommend:active { transform: scale(.97); }

/* Result cards */
.result-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 16px rgba(0,0,0,.06);
}
.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.result-rank {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}
.rank-1 { background: #F5A623; }
.rank-2 { background: #8E8E93; }
.rank-3 { background: #CD7F32; }
.result-outfit { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.result-reason { font-size: 13px; color: var(--sub); line-height: 1.5; }

/* Notice */
.notice {
  text-align: center;
  font-size: 11px;
  color: #c0c0c0;
  margin: 20px 0;
  padding: 10px;
  border: 1px dashed #ddd;
  border-radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1a2e; --card: #252540; --text: #e8e8e8; --sub: #999; }
  .scene-card { box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .result-card { box-shadow: 0 2px 16px rgba(0,0,0,.2); }
  .notice { color: #666; border-color: #333; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">焕</div>
  <div>
    <div class="title">RMAGC 一键搭配</div>
    <div class="subtitle">云端大模型智能推荐</div>
  </div>
</div>

<div class="main">

  <!-- Scene Selection -->
  <div class="scene-row" id="scenes">
    <div class="scene-card active" onclick="selectScene(this,'business')">
      <div class="scene-emoji">💼</div>
      <div class="scene-label">商务会议</div>
    </div>
    <div class="scene-card" onclick="selectScene(this,'casual')">
      <div class="scene-emoji">☕</div>
      <div class="scene-label">休闲出街</div>
    </div>
    <div class="scene-card" onclick="selectScene(this,'sport')">
      <div class="scene-emoji">🏃</div>
      <div class="scene-label">运动健身</div>
    </div>
    <div class="scene-card" onclick="selectScene(this,'date')">
      <div class="scene-emoji">🌹</div>
      <div class="scene-label">约会晚宴</div>
    </div>
  </div>

  <!-- Seed Garment -->
  <div class="seed-card">
    <div class="seed-title">📌 种子衣物（已选）</div>
    <span class="seed-tag">👔 白色衬衫</span>
  </div>

  <!-- Recommend Button -->
  <button class="btn-recommend" onclick="getRecommendation()">
    ✨ 一键生成搭配推荐
  </button>

  <!-- Results -->
  <div id="results"></div>

  <!-- API Notice -->
  <div class="notice">
    💡 云端大模型 API 接口已预留，可接入 GPT-4o / DeepSeek<br>
    当前展示为预置示例推荐结果，用于 UI 原型演示
  </div>
</div>

<script>
// ==================== Pre-built demo recommendations ====================
const demoOutfits = {
  business: [
    { outfit: "白色衬衫 + 深蓝色西装裤 + 黑色牛津鞋",
      reason: "经典商务配色，白色衬衫搭配深蓝西裤稳重端庄，牛津鞋提升正式感，适合重要会议场合。" },
    { outfit: "白色衬衫 + 灰色格纹半裙 + 米色低跟鞋",
      reason: "柔和的灰白组合专业又不失亲和力，格纹添加细节层次，适合创意行业商务会面。" },
    { outfit: "白色衬衫外搭驼色风衣 + 直筒牛仔裤 + 棕色乐福鞋",
      reason: "Smart Casual 风格，风衣增强气场，牛仔裤平衡正式感，适合商务休闲场合。" },
  ],
  casual: [
    { outfit: "白色衬衫敞开穿 + 白T恤内搭 + 浅色破洞牛仔 + 帆布鞋",
      reason: "慵懒层次感穿搭，衬衫当外套增加造型感，帆布鞋提升青春活力，适合周末逛街。" },
    { outfit: "白色衬衫 + 卡其色短裤 + 编织腰带 + 渔夫帽",
      reason: "夏日清爽组合，卡其色中和白色，配饰增加造型完成度，适合户外咖啡/公园散步。" },
    { outfit: "白色衬衫 + 黑色修身牛仔裤 + 切尔西靴",
      reason: "简约不简单的黑白配，修身穿搭凸显身材线条，切尔西靴增加时髦度，适合朋友聚会。" },
  ],
  sport: [
    { outfit: "白色衬衫改造 + 骑行裤 + 老爹鞋 + 棒球帽",
      reason: "运动混搭风，骑行裤平衡衬衫正式感，老爹鞋保证运动舒适，适合轻运动后直接转日常。" },
    { outfit: "白色速干POLO衫 + 运动短裤 + 飞织跑鞋",
      reason: "纯运动场景推荐换为功能性面料，保持白+深色配色逻辑，吸湿排汗，适合户外运动。" },
    { outfit: "白色宽松衬衫 + 瑜伽裤 + 轻薄防晒外套",
      reason: "运动叠穿思路，瑜伽裤保证活动自由度，衬衫防晒兼顾造型，适合晨跑/快走。" },
  ],
  date: [
    { outfit: "白色衬衫 + 酒红色丝绒半裙 + 尖头高跟鞋 + 珍珠耳钉",
      reason: "优雅约会造型，酒红色增添浪漫气氛，丝绒材质提升质感，珍珠点缀温婉气质。" },
    { outfit: "白色衬衫单侧打结 + 高腰阔腿裤 + 系带凉鞋",
      reason: "小心机穿搭，衬衫打结露出腰线，阔腿裤拉长比例，适合烛光晚餐。" },
    { outfit: "白色衬衫 + 黑色吊带裙叠穿 + 马丁靴",
      reason: "甜酷风格，衬衫叠穿吊带裙增加层次，马丁靴平衡柔美感，适合音乐会/展览约会。" },
  ],
};

let currentScene = 'business';

function selectScene(el, scene) {
  document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentScene = scene;
}

function getRecommendation() {
  const results = demoOutfits[currentScene];
  const container = document.getElementById('results');

  container.innerHTML = results.map((r, i) => `
    <div class="result-card">
      <div class="result-header">
        <span style="font-size:13px;color:var(--sub)">推荐 ${i + 1}</span>
        <div class="result-rank rank-${i + 1}">${['🥇','🥈','🥉'][i]}</div>
      </div>
      <div class="result-outfit">${r.outfit}</div>
      <div class="result-reason">📝 ${r.reason}</div>
    </div>
  `).join('');

  container.scrollIntoView({ behavior: 'smooth' });
}

// Load default
getRecommendation();
</script>
</body>
</html>
