; RMAGC · 通道识别固件（identify）
; 用途：全拆重装后，实测「7 个舵机分别插在哪个通道」。
; 与主固件 code_v0.1/firmware 的区别：上电不归位、不带相机/ WiFi，只做通道点动。
; 烧录：pio run -d code_v0.2/identify -t upload

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 与主固件保持同一套 N16R8 内存配置，避免烧完出现「主固件能跑、这个起不来」
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_WARN

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.1.1